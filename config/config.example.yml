server:
  appdebug: true   # 设置程序所处的模式，debug=true 调试模式，日志优先显示在控制台， debug=false 非调试模式，日志将写入日志文件
  cachetype: "redis" #缓存模式 memory OR redis
  syslog: false  # 是否开启系统日志
  multitenant: true  # 多租户开关。false 时停用前后端全部租户功能（数据不再按租户隔离、租户管理/切换接口停用、界面隐藏），退化为单体应用；缺省视为 true
  notcheckuser: []   # 不检查权限的用户（api、菜单及数据权限均不检查）。initadmin.enabled=true 时 initadmin.id 自动豁免，无需重复配置。警告：若与演示账号同时配置，演示密码可被匿名获取并绕过全部权限校验，生产环境务必保持为空
  # 超管账号初始化配置（全新部署时使用：建空库导入纯结构 SQL 后，启动程序自动创建超管）
  initadmin:
    enabled: true    # 是否随程序启动自动初始化超管账号（仅当用户不存在时创建）。注意：初始化成功后应将 enabled 设置为 false
    id: 1            # 超管用户ID。enabled 为 true 时该用户不检查权限（api、菜单及数据权限均放行）；enabled 设为 false 后，如需保留权限豁免请将该 id 加入 notcheckuser
    username: "admin"      # 超管登录账号
    password: "123456"     # 超管初始密码（首次创建时 bcrypt 加密入库），初始化完成后可从配置中删除
  # 演示账号配置
  demoaccount:
    enabled: false    # 是否启用演示账号功能
    # 演示账号的用户ID列表，可以设置多个账号
    userids: []       # 演示账号的用户ID列表，例如：[1, 2, 3]
    defaultusername: "admin"  # 登录页默认账号
    defaultpassword: "123456"  # 演示密码（显示在登录页密码框 placeholder，由用户自行输入）
    # 允许演示账号执行非GET请求的路径前缀列表（白名单）
    # 配置后，演示账号可以对这些路径执行POST/PUT/DELETE等操作
    # 示例：
    # allowpathprefixes:
    #   - "/api/demo/"          # 演示相关API
    #   - "/api/public/"        # 公开API
    #   - "/api/plugins/test/"  # 测试插件API
    allowpathprefixes: []

system: 
  #系统LOGO
  systemlogo: ""
  #系统图标
  systemicon: ""
  #系统名称
  systemname: "GinFast"
  #版权声明
  systemcopyright: "Copyright © 2025 -2028  云南奇讯科技有限公司版权所有"
  #备案号
  systemrecordno: "滇ICP备16002997号"
safe:
  #密码错误锁定阈值(指定时间内连续登录失败次数达到该值将锁定账号,0表示不锁定)
  loginlockthreshold: 3
  #连续登录失败次数记录缓存时间(单位秒)
  loginlockexpire: 60
  #账号锁定时长(单位秒)
  loginlockduration: 600
  #密码最小长度
  minpasswordlength: 6
  #密码是否必须包含特殊字符
  requirespecialchar: true
captcha:
  open : false  # 是否开启验证码功能
  length: 4   # 验证码生成时的长度
httpserver:
  port: ":8080"    # 服务端口
  # 是否启用CORS跨域中间件
  # true  = 启用，按下方 corsorigins 白名单放行跨域请求（白名单决定谁能跨域访问）
  # false = 不注册中间件，浏览器跨域请求全部被拦截
  # 注意：CORS 仅对浏览器生效（curl/服务端互调不受影响）；
  #      前后端同源部署（nginx 托管前端静态文件并将 /api 反代到本服务）时不触发跨域校验，此项设 true/false 均无影响
  allowcrossdomain: true
  # 跨域来源白名单（仅 allowcrossdomain: true 时生效）：
  # 1. 与浏览器请求头 Origin 精确匹配，协议+域名+端口必须完全一致且不带尾部斜杠：
  #    http/https、带/不带 www、不同端口均视为不同 Origin，如 https://example.com ≠ https://www.example.com ≠ http://example.com:8080
  # 2. 填写前端页面所在的 Origin（不是后端自己的地址）；页面有多个访问入口（多域名/多端口）时需逐个列出
  # 3. 未命中的来源不回显 Access-Control-Allow-Origin，浏览器将拦截跨域请求（前端接口全部失败，浏览器控制台报 CORS 错误）
  # 4. 配置 "*" 可放行任意来源（不带凭证），等于放弃来源白名单，生产环境不建议使用
  # 5. 前后端同源部署时可留空：corsorigins: []
  # 以下示例为前端 vite dev 默认端口与商城小程序 H5 演示端口（manifest.json h5.devServer.port）：
  corsorigins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:8090"
    - "http://127.0.0.1:8090"
  serverrootpath: "/public" # 静态资源路由路径
  serverroot: "./resource/public" # 静态资源根目录
  read_timeout: 30    # TCP读取超时(秒)
  write_timeout: 30   # TCP写入超时(秒)
  idle_timeout: 60    # TCP空闲连接超时(秒)
  handler_timeout: 30 #  请求处理超时(秒)，超过该时间，将返回超时错误
token:
  jwttokensignkey:  "df2a2166baa06cf67abcf687dd043bf7c4fe3a270447cc8326e8cc9f3e76944c"   #设置token生成时加密的签名（部署时务必更换为随机强密钥，勿使用示例值）
  jwttokenexpire:  43200    #设置token过期时间，单位秒 示例:43200=12小时
  jwttokenrefreshexpire:  2592000  #设置刷新token过期时间，单位秒 示例:2592000=30天
  cachekeyprefix: "gin-fast:"  # 缓存前缀
  isCache: false  # 是否开启token缓存 (注意开启后会降低token验证的性能,但是注销token后token立即失效)
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""  # 设置你的redis密码
  maxidle: 10
  maxactive: 1000
  idletimeout: 60
  indexdb: 1               # 默认连接的redis是1号数据库，不是0号数据库
  connfailretrytimes: 3    #从连接池获取连接失败，最大重试次数
  reconnectinterval: 1     # 从连接池获取连接失败，每次重试之间间隔的秒数
logs:
  ginlogname: "/resource/logs/gin.log"                  #设置 gin 框架的接口访问日志，v1.5.xx 以后的版本不再生成gin原生的接口访问日志
  zaplogname: "/resource/logs/ginfast.log"    #设置项目骨架运行时日志文件名，注意该名称不要与上一条重复 ,避免和 gin 框架的日志掺杂一起，造成混乱。
  textformat: "console"                                   #记录日志的格式，参数选项：console、json ， console 表示一般的文本格式
  timeprecision: "second"                   #记录日志时，相关的时间精度，该参数选项：second  、 millisecond ， 分别表示 秒 和 毫秒 ,默认为毫秒级别
  level: "info"                                      #日志级别，参数选项：debug、info、warn、error、fatal、panic，默认为 info, 开发、测试及生产环境建议分别设置为 debug、info、warn
  maxsize: 5                                             #每个日志的最大尺寸(以MB为单位）， 超过该值，系统将会自动进行切割
  maxbackups: 7                                        #保留旧日志最大个数
  maxage: 15                                            #保留旧日志最大天数
  compress: false                                      #日志备份时，是否进行压缩
casbin:
  autoloadpolicyseconds: 120 # 扫描数据库策略的频率(单位：秒)
  tableprefix: "sys_"
  tablename: "casbin_rule" 
  # modelconfig：Casbin 访问控制模型（竖线 | 表示以下整段文本保持换行格式）
  # ============ 请求定义 ============
  # [request_definition] 定义一次鉴权请求携带的参数及顺序，与代码中 Enforce(sub, obj, act, dom) 传参一一对应
  #   sub：请求主体，带前缀的用户ID（如 user_1），见 casbinhelper.PrefixUser
  #   obj：请求对象，即接口路径（如 /api/users）
  #   act：操作，即 HTTP 方法（如 GET、POST）
  #   dom：域，即租户，格式 domain_租户ID（如 domain_1）；无租户的请求传 *，代表全局权限
  # ============ 策略定义 ============
  # [policy_definition] 定义 sys_casbin_rule 表中 ptype='p' 的策略行格式，表中 v0~v3 列按此顺序对应
  #   sub：策略主体，带前缀的角色ID（如 role_1），权限挂在角色上而非直接挂用户
  #   obj：被授权的接口路径，支持 KeyMatch2 通配写法
  #   act：被授权的 HTTP 方法，匹配时按正则处理
  #   dom：授权域（租户）：写精确 domain_x 仅对该租户生效；写 * 对所有租户生效（见匹配器末段）
  # ============ 角色定义 ============
  # [role_definition] 定义 sys_casbin_rule 表中 ptype='g' 的规则格式（用户-角色分配、角色-角色继承）
  #   三个下划线表示每条 g 规则带域参数：v0=成员(用户或子角色)、v1=角色(或父角色)、v2=域(租户)
  #   g 规则的域支持模式匹配（如 * 表示所有租户生效），因为代码给 g 段注册了 KeyMatch2 域匹配函数
  # ============ 策略效果 ============
  # [policy_effect] 多条策略的裁决方式：只要存在任意一条 p 策略匹配成功（p.eft == allow），请求即放行
  # ============ 匹配器 ============
  # [matchers] 请求与策略的匹配规则，四段条件 && 连接、全部满足才有权限：
  #   ① g(r.sub, p.sub, r.dom)：在请求租户 r.dom 下，用户 r.sub 经 g 规则链（含角色继承）关联到策略主体 p.sub
  #   ② keyMatch2(r.obj, p.obj)：请求路径与授权路径按 KeyMatch2 匹配（支持 /api/**、:id 等 RESTful 通配）
  #   ③ regexMatch(r.act, p.act)：HTTP 方法按正则匹配（策略中可写 GET|POST 这类表达式）
  #   ④ (r.dom == p.dom || p.dom == "*")：请求租户与策略租户精确相等，或策略域为 * 通配所有租户
  #      注意 p.dom 不走 KeyMatch2，只能写精确 domain_x 或 *，写 domain_* 之类的模式无效
  # 注意：若在下方模型文本内加注释，只能整行以 # 开头（casbin 解析器会跳过），不可追加在 [xxx] 行尾（会破坏段识别）
  modelconfig: |
    [request_definition]
    r = sub, obj, act, dom
    [policy_definition]
    p = sub, obj, act, dom
    [role_definition]
    g = _, _, _
    [policy_effect]
    e = some(where (p.eft == allow))
    [matchers]
    m =  g(r.sub, p.sub, r.dom) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act) && (r.dom == p.dom || p.dom == "*")
gormv2: # 只针对 gorm  操作数据库有效
  usedbtype: "mysql"   # 默认使用的数据库类型（mysql、sqlserver、postgresql）
  mysql:
    isinitglobalgormmysql: 1      # 随项目启动初始化一个全局变量 gorm.Db（1=开启、0=关闭）
    slowthreshold: 30            # 慢 SQL 阈值(sql执行时间超过此时间单位（秒），就会触发系统日志记录)
    timezone: "Local"            # 时区配置，例如: Local, Asia/Shanghai, UTC 等
    write:
      host: "127.0.0.1"
      database: "gin-fast"
      port: 3306
      prefix: ""
      user: "root"
      pass: "root"
      charset: "utf8mb4"
      setmaxidleconns: 10    # 最大空闲连接数
      setmaxopenconns: 128   # 最大打开连接数
      setconnmaxlifetime: 60    # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
    isopenreaddb: 0                     # 是否开启读写分离配置（1=开启、0=关闭），IsOpenReadDb=1,Read 部分参数有效，否则Read部分参数直接忽略
    read:
      host: "127.0.0.1"
      database: "gin-fast"
      port: 3306                        #注意，非3306，请自行调整
      prefix: ""
      user: "root"
      pass: "root"  # 修改为你自己的数据库密码
      charset: "utf8mb4"
      setmaxidleconns: 10    # 最大空闲连接数
      setmaxopenconns: 128    # 最大打开连接数
      setconnmaxlifetime: 60    # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
  sqlserver:
    isinitglobalgormsqlserver: 0  # 随项目启动初始一个全局变量 gorm.Db（1=开启、0=关闭）
    slowthreshold: 30
    timezone: ""                  # SQL Server 不需要时区配置
    write:
      host: "127.0.0.1"
      database: "gin-fast"
      port: 1433
      prefix: ""
      user: ""
      pass: ""
      setmaxidleconns: 10
      setmaxopenconns: 128
      setconnmaxlifetime: 60
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
    isopenreaddb: 0            # 是否开启读写分离配置（1=开启、0=关闭
    read:
      host: "127.0.0.1"
      database: "gin-fast"
      port: 1433
      prefix: ""
      user: ""
      pass: ""
      setmaxidleconns: 10   
      setmaxopenconns: 128
      setconnmaxlifetime: 60  # 连接最大生存时间(秒)
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
  postgresql:
    isinitglobalgormpostgresql: 0   # 随项目启动初始一个全局变量 gorm.Db（1=开启、0=关闭）
    slowthreshold: 30
    timezone: "Asia/Shanghai"       # 时区配置，例如: Asia/Shanghai, UTC 等
    write:
      host: "127.0.0.1"
      database: "gin-fast"
      port: 5432
      prefix: ""
      user: ""
      pass: ""
      setmaxidleconns: 10
      setmaxopenconns: 128
      setconnmaxlifetime: 60
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)
    isopenreaddb: 0            # 是否开启读写分离配置（1=开启、0=关闭），IsOpenReadDb=1,Read  部分参数有效，否则Read部分参数直接忽略
    read:
      host: "127.0.0.1"
      database: "gin-fast"
      port: 5432
      prefix: ""
      user: ""
      pass: ""
      setmaxidleconns: 10
      setmaxopenconns: 128
      setconnmaxlifetime: 60
      setconnmaxidletime: 30    # 空闲连接最大存活时间(秒)

# 文件上传配置
upload:
  # 上传方式: local-本地上传, qiniu-七牛云上传
  upload_type: "local"
  
  # 最大文件大小(单位: MB)
  max_size: 10
  
  # 允许的文件类型
  allowed_types: [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".pdf", ".doc", ".docx", ".xls", ".xlsx", ".txt", ".zip", ".rar", ".svg", ".ico", ".mp4", ".avi", ".webp"]
  
  # 本地上传路径
  local_path: "./resource/public/uploads"
  
  # 七牛云配置
  qiniu_config:
    access_key: ""      # 七牛云AccessKey
    secret_key: ""      # 七牛云SecretKey
    bucket: ""           # 七牛云存储空间名称
    domain: ""           # 七牛云域名
    zone: "ZoneHuadong"  # 七牛云存储区域: ZoneHuadong, ZoneHuabei, ZoneHuanan, ZoneBeimei, ZoneXinjiapo
  
  # 分片上传配置
  # 分片上传最大文件总大小(单位: MB)
  chunk_max_size: 5120
  # 单个分片最大大小(单位: MB)
  max_chunk_size: 5
  # 分片上传允许的文件类型(为空则允许所有类型)
  chunk_allowed_types: [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".pdf", ".doc", ".docx", ".xls", ".xlsx", ".txt", ".zip", ".rar", ".mp4", ".avi", ".webp", ".svg", ".ico"]

#代码生成
gen:
  # 前端代码生成路径
  dir: "../ginfast-tenant-ui"

# 任务调度器配置
scheduler:
  # 日志配置
  log:
    dir: "/resource/logs/scheduler"  # 日志目录
    level: "info"                     # 日志级别: debug, info, warn, error, fatal
  # 任务结果通道缓冲大小
  job_results_buffer_size: 1000       # 任务结果通道缓冲大小，默认1000
